[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nordis-smb-inspector"
version = "0.1.0"
description = "Local SMB assessment for authorized Windows and Samba environments"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Efe Körün" },
]
dependencies = [
  "anyio==4.14.2",
  "charset-normalizer==3.4.9",
  "dnspython==2.8.0",
  "impacket==0.13.1",
  "jinja2==3.1.6",
  "pypdf==6.15.0",
  "pyspnego==0.12.1",
  "smbprotocol[kerberos]==1.17.0",
  "starlette==1.6.0",
  "uvicorn==0.52.2",
]

[project.scripts]
nordis-smb-inspector = "nordis_smb_inspector.cli:main"

[project.optional-dependencies]
dev = [
  "httpx2==2.10.0",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nordis_smb_inspector.web" = [
  "static/*.css",
  "static/*.js",
  "static/*.svg",
  "templates/*.html",
]

[tool.setuptools.data-files]
"share/nordis-smb-inspector/rules" = [
  "rules/cloud-services.toml",
  "rules/general-secrets.toml",
  "rules/infrastructure.toml",
  "rules/password-hashes.toml",
  "rules/windows-ad.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
