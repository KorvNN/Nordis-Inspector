[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nordis-smb-inspector"
version = "0.1.0"
description = "Authorized SMB inventory and sensitive-content inspection"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "NordisGlobal" },
]
dependencies = [
  "anyio==4.14.2",
  "charset-normalizer==3.4.9",
  "jinja2==3.1.6",
  "pyspnego==0.12.1",
  "smbprotocol[kerberos]==1.17.0",
  "starlette==1.6.0",
  "uvicorn==0.52.2",
]

[project.scripts]
nordis-smb-inspector = "nordis_smb_inspector.cli:main"

[project.optional-dependencies]
dev = [
  "httpx2==2.10.0",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nordis_smb_inspector.web" = [
  "static/*.css",
  "static/*.js",
  "templates/*.html",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
