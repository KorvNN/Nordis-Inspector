schema_version = 1
pack_id = "general_secrets"
title_tr = "Genel kimlik bilgileri ve gizli değerler"
title_en = "General credentials and secrets"

[[rules]]
rule_id = "jwt-token"
title = "JWT token"
category = "Oturum tokenı"
confidence = "high"
pattern = "\\beyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\b"
keywords = ["eyJ"]

[[rules]]
rule_id = "private-key-header"
title = "Private key başlangıcı"
category = "Kriptografik anahtar"
confidence = "high"
pattern = "-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED |PGP |SSH2 ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----"
keywords = ["PRIVATE KEY"]

[[rules]]
rule_id = "authorization-bearer"
title = "Bearer token"
category = "Oturum tokenı"
confidence = "medium"
pattern = "\\bBearer[ \\t]+[A-Za-z0-9._~+/=-]{16,}"
keywords = ["Bearer"]

[[rules]]
rule_id = "authorization-basic"
title = "Basic authentication değeri"
category = "Kimlik bilgisi"
confidence = "high"
pattern = "\\bBasic[ \\t]+[A-Za-z0-9+/]{12,}={0,2}\\b"
keywords = ["Basic"]

[[rules]]
rule_id = "credential-url"
title = "URL içinde kimlik bilgisi"
category = "Kimlik bilgisi"
confidence = "high"
pattern = "\\b[a-z][a-z0-9+.-]{1,15}://[^\\s/:@]+:(?P<secret>[^\\s/@]{3,})@[^\\s/]+"
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "connection-string-password"
title = "Veritabanı bağlantı parolası"
category = "Veritabanı"
confidence = "high"
pattern = "^(?=[^\\r\\n]*\\b(?:Server|Data[ \\t]+Source|Host|Database|Initial[ \\t]+Catalog|User[ \\t]+Id|UID)[ \\t]*=)[^\\r\\n]*?\\b(?:Password|Pwd)[ \\t]*=[ \\t]*(?P<secret>[^;\\s'\"]{3,}|['\"][^'\"\\r\\n]{3,}['\"])"
keywords = ["password", "pwd"]
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "secret-assignment"
title = "Hassas yapılandırma ataması"
category = "Yapılandırma"
confidence = "medium"
pattern = "(?<![A-Za-z0-9])['\"]?(?:(?:[A-Za-z0-9]{1,32}[_.-]){1,4}(?:password|passwd|pwd|pass|passphrase|secret|token)|[A-Za-z0-9]{1,48}(?:password|passwd|pwd|passphrase|secret|token)|password|passwd|pwd|passphrase|secret|token|(?:(?:[A-Za-z0-9]{1,32}[_.-]){0,3}(?:api|access|secret|license|private|signing|encryption|hmac|master|admin|role|server|service[_.-]?account)[ _.-]?key)|secret[ _.-]?access[ _.-]?key|(?:auth|refresh|session|service|personal|shared|webhook|consumer|client|application|app|bot|deploy|runner|job|registration|impersonation|workspace|security|sas|oauth|id|user)[ _.-]?(?:key|secret|token)|(?:rediscli|neo4j|registry|docker)[_.-]?auth|(?:azure[_.-]?devops(?:[_.-]?ext)?|ado|github|gitlab)[_.-]?pat|(?:private|client)[_.-]?key[_.-]?data|şifre|sifre|parola|(?:api|admin|yönetici|yonetici|kök|kok|servis|proxy|anahtar|özel|ozel|veritabanı|veritabani|yedekleme|kurtarma|webhook|oturum|erişim|erisim|yenileme|istemci|gizli|kişisel|kisisel)[ _.-]*(?:şifre(?:si)?|sifre(?:si)?|parola(?:sı|si)?|anahtar(?:ı|i)?|token(?:ı|i)?|belirte(?:ci|ç)|sır(?:rı)?|sir(?:ri)?|değer|deger|kodu))['\"]?[ \\t]*[:=][ \\t]*(?P<secret>'[^'\\r\\n]{4,4096}'|\"[^\"\\r\\n]{4,4096}\"|\\$\\{[^}\\r\\n]{1,256}\\}|\\{\\{[^{}\\r\\n]{1,256}\\}\\}|[^\\s,;#'\"}\\]]{4,4096})"
keywords = ["password", "passwd", "pwd", "pass", "secret", "token", "key", "auth", "pat", "şifre", "sifre", "parola", "anahtar", "belirte", "sır", "sir", "değer", "deger", "kodu"]
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "natural-language-secret"
title = "Metin içinde belirtilen parola"
category = "Kimlik bilgisi"
confidence = "high"
pattern = "(?<![A-Za-z0-9])(?:(?:(?:my|our|his|her|their|user['’]?s|account['’]?s)[ \\t]+(?:password|passwd|passphrase)[ \\t]+(?:is|was))|(?:(?:parolam|parolamız|parolamiz|şifrem|şifremiz|sifrem|sifremiz|kullanıcının[ \\t]+(?:parolası|şifresi)|kullanicinin[ \\t]+(?:parolasi|sifresi))[ \\t]*(?::|=|şudur|sudur)))[ \\t]*(?P<secret>'[^'\\r\\n]{4,256}'|\"[^\"\\r\\n]{4,256}\"|[^\\s,;#'\"}\\]]{4,256})"
keywords = ["password", "passwd", "passphrase", "parolam", "parolamız", "parolamiz", "şifrem", "şifremiz", "sifrem", "sifremiz", "kullanıcının", "kullanicinin"]
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "recovery-secret-assignment"
title = "Kurtarma veya MFA sırrı"
category = "Kimlik bilgisi"
confidence = "high"
pattern = "(?<![A-Za-z0-9])['\"]?(?:(?:otp|totp|mfa)[_.-]?(?:seed|secret)|seed[_.-]?phrase|mnemonic|recovery[_.-]?(?:code|key|token)|backup[_.-]?(?:code|key)|(?:kurtarma|yedek)[ _.-]*(?:kodu|anahtarı|anahtari))['\"]?[ \\t]*[:=][ \\t]*(?P<secret>'[^'\\r\\n]{4,4096}'|\"[^\"\\r\\n]{4,4096}\"|\\$\\{[^}\\r\\n]{1,256}\\}|\\{\\{[^{}\\r\\n]{1,256}\\}\\}|[^\\s,;#'\"}\\]]{4,4096})"
keywords = ["otp", "mfa", "seed", "mnemonic", "recovery", "backup", "kurtarma", "yedek"]
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "authorization-token-header"
title = "Kimlik doğrulama başlığı değeri"
category = "Kimlik bilgisi"
confidence = "high"
pattern = "(?<![A-Za-z0-9_-])(?:Authorization|Proxy-Authorization|X-API-Key|X-Auth-Token|API-Key|API-Token)[ \\t]*:[ \\t]*(?!(?:Bearer|Basic)\\b)(?:(?:Token|ApiKey)[ \\t]+)?(?P<secret>[A-Za-z0-9._~+/=-]{12,})(?![A-Za-z0-9._~+/=-])"
keywords = ["Authorization:", "Proxy-Authorization:", "X-API-Key:", "X-Auth-Token:", "API-Key:", "API-Token:"]
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "slack-token-prefix"
title = "Slack token"
category = "Oturum tokenı"
confidence = "high"
pattern = "\\b(?:xox[baprs]|xapp)-[A-Za-z0-9-]{20,}\\b"
keywords = ["xox", "xapp-"]

[[rules]]
rule_id = "cookie-secret-assignment"
title = "Session cookie değeri"
category = "Oturum tokenı"
confidence = "medium"
pattern = "(?<![A-Za-z0-9])['\"]?(?:(?:session|auth|access|signed)[_-]?cookie|oturum[ _.-]?çerezi)['\"]?[ \\t]*[:=][ \\t]*(?P<secret>'[^'\\r\\n]{12,4096}'|\"[^\"\\r\\n]{12,4096}\"|[^;\\s'\"]{12,4096})"
keywords = ["cookie", "çerez"]
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "netrc-credential"
title = "netrc kimlik bilgisi"
category = "Kimlik bilgisi"
confidence = "high"
pattern = "\\bmachine[ \\t]+\\S+[ \\t]+login[ \\t]+\\S+[ \\t]+password[ \\t]+(?P<secret>\\S+)"
keywords = ["machine", "login", "password"]
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "age-encrypted-file"
title = "Age encrypted file"
category = "Kriptografik anahtar"
confidence = "high"
pattern = "(?:-----BEGIN AGE ENCRYPTED FILE-----|^age-encryption\\.org/v1$)"
keywords = ["BEGIN AGE ENCRYPTED FILE", "age-encryption.org/v1"]

[[rules]]
rule_id = "encrypted-pem-marker"
title = "Şifreli PEM private key işareti"
category = "Kriptografik anahtar"
confidence = "high"
pattern = "^Proc-Type:[ \\t]*4,ENCRYPTED$"
keywords = ["Proc-Type:", "ENCRYPTED"]

[[rules]]
rule_id = "xml-secret-element"
title = "XML credential value"
category = "Yapılandırma"
confidence = "medium"
pattern = "<(?:[A-Za-z0-9_.-]+:)?(?:Password|Passphrase|Secret|ApiKey|ApiSecret|ClientSecret|AccessToken|RefreshToken)(?:[ \\t]+[^>]*)?>[ \\t]*(?P<secret>[^<\\r\\n]{4,})[ \\t]*</(?:[A-Za-z0-9_.-]+:)?(?:Password|Passphrase|Secret|ApiKey|ApiSecret|ClientSecret|AccessToken|RefreshToken)>"
keywords = ["<Password", "<Passphrase", "<Secret", "<ApiKey", "<ApiSecret", "<ClientSecret", "<AccessToken", "<RefreshToken"]
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "url-query-secret"
title = "URL query credential"
category = "Kimlik bilgisi"
confidence = "medium"
pattern = "[?&](?:api[_-]?key|api[_-]?token|access[_-]?token|auth[_-]?token|client[_-]?secret|password|signature|sig)=(?P<secret>[A-Za-z0-9._~%+/=-]{12,})"
keywords = ["?api", "&api", "access_token=", "auth_token=", "client_secret=", "password=", "signature=", "sig="]
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "age-secret-key"
title = "Age secret key"
category = "Kriptografik anahtar"
confidence = "high"
pattern = "\\bAGE-SECRET-KEY-1[0-9A-Z]{20,}\\b"
keywords = ["AGE-SECRET-KEY-1"]
