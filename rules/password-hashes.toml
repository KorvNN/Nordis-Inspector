schema_version = 1
pack_id = "password_hashes"
title_tr = "Parola hashleri"
title_en = "Password hashes"

[[rules]]
rule_id = "lm-nt-hash-pair"
title = "LM/NT hash çifti"
category = "Credential artifact"
confidence = "high"
pattern = "(?<![0-9A-Fa-f])[0-9A-Fa-f]{32}:[0-9A-Fa-f]{32}(?![0-9A-Fa-f])"

[[rules]]
rule_id = "credential-dump-line"
title = "Hesap RID ve hash satırı"
category = "Credential artifact"
confidence = "high"
pattern = "^[^:\\r\\n]{1,128}:[0-9]{1,10}:[0-9A-Fa-f]{32}:[0-9A-Fa-f]{32}(?:::[^\\r\\n]*)?$"

[[rules]]
rule_id = "netntlmv2-response"
title = "NetNTLMv2 challenge-response"
category = "Credential artifact"
confidence = "high"
pattern = "^[^:\\r\\n]{1,128}::[^:\\r\\n]{1,128}:[0-9A-Fa-f]{16}:[0-9A-Fa-f]{32}:[0-9A-Fa-f]{32,}$"

[[rules]]
rule_id = "netntlmv1-response"
title = "NetNTLMv1 challenge-response"
category = "Credential artifact"
confidence = "high"
pattern = "^[^:\\r\\n]{0,128}::[^:\\r\\n]{1,128}:[0-9A-Fa-f]{48}:[0-9A-Fa-f]{48}:[0-9A-Fa-f]{16}$"

[[rules]]
rule_id = "dcc2-hash"
title = "Windows cached domain credential"
category = "Credential artifact"
confidence = "high"
pattern = "\\$DCC2\\$[0-9]+#[^#\\s]{1,128}#[0-9A-Fa-f]{32}"
keywords = ["$DCC2$"]

[[rules]]
rule_id = "labelled-password-hash"
title = "Etiketli parola hash değeri"
category = "Credential artifact"
confidence = "high"
pattern = "\\b(?:password|passwd|pwd)[ _.-]?(?:hash|digest)[ \\t]*[:=][ \\t]*['\"]?(?P<secret>(?:0x)?[0-9A-Fa-f]{16,256}|[A-Za-z0-9+/]{24,}={0,2})(?![A-Za-z0-9+/=])"
keywords = ["password_hash", "password-hash", "password hash", "passwordhash", "password_digest", "password-digest", "password digest", "passworddigest", "passwd_hash", "passwd-hash", "passwd hash", "passwdhash", "pwd_hash", "pwd-hash", "pwd hash", "pwdhash"]
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "unix-password-hash"
title = "Unix password hash"
category = "Credential artifact"
confidence = "high"
pattern = "\\$(?:1|5|6)\\$[A-Za-z0-9./]{1,16}\\$[A-Za-z0-9./]{16,}"

[[rules]]
rule_id = "modern-password-hash"
title = "Bcrypt veya Argon2 hash"
category = "Credential artifact"
confidence = "high"
pattern = "(?:\\$2[aby]\\$[0-9]{2}\\$[./A-Za-z0-9]{53}|\\$argon2(?:id|i|d)\\$v=[0-9]+\\$[^\\s]{20,})"

[[rules]]
rule_id = "portable-php-password-hash"
title = "phpass or Drupal password hash"
category = "Credential artifact"
confidence = "high"
pattern = "(?:\\$[PH]\\$[./A-Za-z0-9]{31}|\\$S\\$[./A-Za-z0-9]{52})(?![./A-Za-z0-9])"
keywords = ["$P$", "$H$", "$S$"]

[[rules]]
rule_id = "apache-apr1-hash"
title = "Apache APR1 password hash"
category = "Credential artifact"
confidence = "high"
pattern = "\\$apr1\\$[./A-Za-z0-9]{1,8}\\$[./A-Za-z0-9]{22}(?![./A-Za-z0-9])"
keywords = ["$apr1$"]

[[rules]]
rule_id = "pbkdf2-password-hash"
title = "PBKDF2 password hash"
category = "Credential artifact"
confidence = "high"
pattern = "(?:pbkdf2_sha256\\$[1-9][0-9]{0,8}\\$[^\\s$]{1,128}\\$[A-Za-z0-9+/]{43}=|\\$pbkdf2\\$[1-9][0-9]{0,8}\\$[./A-Za-z0-9]{1,256}\\$[./A-Za-z0-9]{27}(?![./A-Za-z0-9])|\\$pbkdf2-sha256\\$[1-9][0-9]{0,8}\\$[./A-Za-z0-9]{1,256}\\$[./A-Za-z0-9]{43}(?![./A-Za-z0-9])|\\$pbkdf2-sha512\\$[1-9][0-9]{0,8}\\$[./A-Za-z0-9]{1,256}\\$[./A-Za-z0-9]{86}(?![./A-Za-z0-9]))"
keywords = ["pbkdf2_sha256$", "$pbkdf2$", "$pbkdf2-sha256$", "$pbkdf2-sha512$"]

[[rules]]
rule_id = "ldap-password-hash"
title = "LDAP password hash"
category = "Credential artifact"
confidence = "high"
pattern = "\\{(?:SHA|SSHA|SSHA256|SSHA512)\\}[A-Za-z0-9+/]{20,256}={0,2}(?![A-Za-z0-9+/=])"
keywords = ["{SHA}", "{SSHA}", "{SSHA256}", "{SSHA512}"]

[[rules]]
rule_id = "mysql-password-hash"
title = "MySQL password hash"
category = "Credential artifact"
confidence = "high"
pattern = "(?<![0-9A-Fa-f])\\*[0-9A-Fa-f]{40}(?![0-9A-Fa-f])"

[[rules]]
rule_id = "mssql-password-hash"
title = "Microsoft SQL Server password hash"
category = "Credential artifact"
confidence = "high"
pattern = "(?<![0-9A-Fa-f])(?:0x0100[0-9A-Fa-f]{48}|0x0200[0-9A-Fa-f]{136})(?![0-9A-Fa-f])"
keywords = ["0x0100", "0x0200"]

[[rules]]
rule_id = "postgresql-scram-hash"
title = "PostgreSQL SCRAM password hash"
category = "Credential artifact"
confidence = "high"
pattern = "SCRAM-SHA-256\\$[1-9][0-9]{0,8}:[A-Za-z0-9+/]{2,256}={0,2}\\$[A-Za-z0-9+/]{43}=:[A-Za-z0-9+/]{43}=(?![A-Za-z0-9+/=])"
keywords = ["SCRAM-SHA-256$"]

[[rules]]
rule_id = "cisco-password-hash"
title = "Cisco IOS password hash"
category = "Credential artifact"
confidence = "high"
pattern = "\\$(?:8|9)\\$[./A-Za-z0-9]{14}\\$[./A-Za-z0-9]{43}(?![./A-Za-z0-9])"
keywords = ["$8$", "$9$"]
