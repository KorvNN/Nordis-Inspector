schema_version = 1
pack_id = "cloud_services"
title_tr = "Bulut, SaaS ve kaynak kod servisleri"
title_en = "Cloud, SaaS, and source control services"

[[rules]]
rule_id = "cloud-access-key"
title = "Cloud access key"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\b(?:AKIA|ASIA)[A-Z0-9]{16}\\b"
keywords = ["AKIA", "ASIA"]

[[rules]]
rule_id = "github-token-prefix"
title = "GitHub access token"
category = "Source control"
confidence = "high"
pattern = "\\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\\b"
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]

[[rules]]
rule_id = "github-fine-grained-token"
title = "GitHub fine-grained token"
category = "Source control"
confidence = "high"
pattern = "\\bgithub_pat_[A-Za-z0-9_]{20,}\\b"
keywords = ["github_pat_"]

[[rules]]
rule_id = "gitlab-token-prefix"
title = "GitLab access token"
category = "Source control"
confidence = "high"
pattern = "\\b(?:glpat|gloas|gldt|glrt|glrtr|glcbt|glptt|glft|glimt|glagent|glwt|glsoat|glffct)-[A-Za-z0-9_-]{10,}\\b"
keywords = ["glpat-", "gloas-", "gldt-", "glrt-", "glrtr-", "glcbt-", "glptt-", "glft-", "glimt-", "glagent-", "glwt-", "glsoat-", "glffct-"]

[[rules]]
rule_id = "stripe-secret-key"
title = "Stripe secret key"
category = "Ödeme servisi"
confidence = "high"
pattern = "\\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}\\b"
keywords = ["sk_live_", "sk_test_", "rk_live_", "rk_test_"]

[[rules]]
rule_id = "stripe-webhook-secret"
title = "Stripe webhook signing secret"
category = "Ödeme servisi"
confidence = "high"
pattern = "\\bwhsec_[A-Za-z0-9]{16,}\\b"
keywords = ["whsec_"]

[[rules]]
rule_id = "sendgrid-api-key"
title = "SendGrid API key"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\bSG\\.[A-Za-z0-9_-]{16,}\\b"
keywords = ["SG."]

[[rules]]
rule_id = "google-api-key"
title = "Google API key"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\bAIza[0-9A-Za-z_-]{30,}\\b"
keywords = ["AIza"]

[[rules]]
rule_id = "huggingface-token-prefix"
title = "Hugging Face token"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\bhf_[A-Za-z0-9]{20,}\\b"
keywords = ["hf_"]

[[rules]]
rule_id = "private-token-header"
title = "Private access token header"
category = "Source control"
confidence = "high"
pattern = "\\b(?:PRIVATE|JOB|DEPLOY|REGISTRY)-TOKEN:[ \\t]*[A-Za-z0-9._~+/=-]{16,}\\b"
keywords = ["-TOKEN:"]

[[rules]]
rule_id = "aws-secret-access-key"
title = "AWS secret access key assignment"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\baws[_-]?secret[_-]?access[_-]?key[ \\t]*[:=][ \\t]*(?P<secret>[A-Za-z0-9/+=]{20,})"
keywords = ["aws", "secret", "access", "key"]
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "digitalocean-token-prefix"
title = "DigitalOcean access token"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\b(?:dop|doo|dor)_v1_[A-Za-z0-9_-]{32,}\\b"
keywords = ["dop_v1_", "doo_v1_", "dor_v1_"]

[[rules]]
rule_id = "azure-devops-pat"
title = "Azure DevOps personal access token"
category = "Source control"
confidence = "high"
pattern = "(?<![A-Za-z0-9])[A-Za-z0-9]{76}AZDO[A-Za-z0-9]{4}(?![A-Za-z0-9])"
keywords = ["AZDO"]

[[rules]]
rule_id = "azure-storage-account-key"
title = "Azure Storage account key"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\b(?:AccountKey|azure[_-]?storage[_-]?(?:account[_-]?)?key|storage[_-]?account[_-]?key)[ \\t]*[:=][ \\t]*['\"]?(?P<secret>[A-Za-z0-9+/]{40,}={0,2})"
keywords = ["AccountKey", "azure_storage", "azure-storage", "storage_account_key", "storage-account-key"]
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "azure-sas-token"
title = "Azure shared access signature"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\b(?:SharedAccessSignature|azure[_-]?sas[_-]?token)[ \\t]*[:=][ \\t]*['\"]?(?P<secret>(?=[^'\"\\s]{20,})(?=[^'\"\\s]*sig=)[^'\"\\s]+)"
keywords = ["SharedAccessSignature", "azure_sas_token", "azure-sas-token"]
secret_group = "secret"
ignore_common_values = true

[[rules]]
rule_id = "google-oauth-client-secret"
title = "Google OAuth client secret"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\bGOCSPX-[A-Za-z0-9_-]{20,}\\b"
keywords = ["GOCSPX-"]

[[rules]]
rule_id = "google-oauth-access-token"
title = "Google OAuth access token"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\bya29\\.[A-Za-z0-9._-]{20,}\\b"
keywords = ["ya29."]

[[rules]]
rule_id = "ai-provider-api-key"
title = "AI service API key"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\b(?:sk-proj-|sk-svcacct-|sk-ant-)[A-Za-z0-9_-]{20,}\\b"
keywords = ["sk-proj-", "sk-svcacct-", "sk-ant-"]

[[rules]]
rule_id = "new-relic-api-key"
title = "New Relic API key"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\bNRAK-[A-Za-z0-9]{20,}\\b"
keywords = ["NRAK-"]

[[rules]]
rule_id = "slack-webhook-url"
title = "Slack webhook URL"
category = "Cloud / SaaS"
confidence = "high"
pattern = "https://hooks\\.slack\\.com/services/[A-Z0-9]{8,}/[A-Z0-9]{8,}/[A-Za-z0-9]{20,}"
keywords = ["hooks.slack.com/services/"]

[[rules]]
rule_id = "discord-webhook-url"
title = "Discord webhook URL"
category = "Cloud / SaaS"
confidence = "high"
pattern = "https://(?:(?:canary|ptb)\\.)?discord(?:app)?\\.com/api/webhooks/[0-9]{16,20}/[A-Za-z0-9._-]{30,}"
keywords = ["discord.com/api/webhooks/", "discordapp.com/api/webhooks/", "canary.discord.com/api/webhooks/", "ptb.discord.com/api/webhooks/"]

[[rules]]
rule_id = "telegram-bot-token"
title = "Telegram bot token"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\b[0-9]{8,12}:[A-Za-z0-9_-]{30,}\\b"

[[rules]]
rule_id = "shopify-access-token"
title = "Shopify access token"
category = "Cloud / SaaS"
confidence = "high"
pattern = "\\bshp(?:at|ca|pa|ss)_[A-Fa-f0-9]{24,}\\b"
keywords = ["shpat_", "shpca_", "shppa_", "shpss_"]
